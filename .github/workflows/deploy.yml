name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs these; the default token is read-only.
permissions:
  contents: read
  pages: write
  id-token: write

# A push while a deploy is in flight should supersede it, not queue behind it — but let the
# in-flight one finish rather than leaving Pages half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Assets are never committed — `assets/` is git-ignored and reproduced from the manifest.
      # The lockfile is committed, so this either produces byte-identical files or fails loudly.
      - name: Fetch CC0 assets
        run: npm run assets

      - name: Process textures
        run: npm run textures

      - name: Unit tests
        run: npm run test:run

      # Served from https://<user>.github.io/<repo>/, so the base has to match the repo name.
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
